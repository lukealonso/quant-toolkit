[project]
name = "quantization"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "nvidia-modelopt[torch] @ git+https://github.com/NVIDIA/TensorRT-Model-Optimizer.git",
    "numpy>=2.0",
    "pillow",
    "protobuf",
    "requests",
    "safetensors>=0.4",
    "sentencepiece",
    "torch>=2.10",
    "torchvision",
    # GLM-5.3-Flash landed after the latest Transformers release. Pin the
    # upstream merge until a tagged release contains glm5_next.
    "transformers @ git+https://github.com/huggingface/transformers.git@eb4d9e2a64a013bec12289288b85d0b1210ba0aa",
]

[tool.uv]
index = [
    { name = "pytorch-cu130", url = "https://download.pytorch.org/whl/cu130" },
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
